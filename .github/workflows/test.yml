name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Create test schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d test_db -c "
            CREATE TABLE users (
              id serial PRIMARY KEY,
              name varchar(100) NOT NULL,
              email varchar(255) UNIQUE,
              created_at timestamptz DEFAULT now()
            );
            COMMENT ON TABLE users IS 'User accounts';
          "

      - name: Make scripts executable
        run: chmod +x pg_dbml scripts/*.sh

      - name: Run tests
        env:
          PG_TEST_URL: postgresql://postgres:postgres@localhost:5432/test_db
        run: make test
